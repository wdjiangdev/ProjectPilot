<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProjectPilot · Agile</title>
<script>(function(){try{var p=localStorage.getItem("gantt-theme-v4")||"system";document.documentElement.dataset.theme=p==="dark"||(p==="system"&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}catch(e){}})()</script>
<style>
:root{--accent:#007aff;--tx1:#1d1d1f;--tx2:#424245;--tx3:#86868b;--bg:#f5f5f7;--card:#fff;--line:rgba(0,0,0,.12);--line2:rgba(0,0,0,.06);
  --m-bar:rgba(246,246,248,.86);--m-ctl:#fff;--m-ctl-h:#f6f6f6;--m-ctl-a:#e9e9eb;--m-bd:rgba(0,0,0,.14);--m-sh:0 .5px 1.5px rgba(0,0,0,.1);--m-seg:rgba(0,0,0,.06);--m-hd:#f2f2f4;--m-sel:rgba(0,122,255,.12);
  --c-epic:#8b5cf6;--c-story:#22c55e;--c-task:#3b82f6;--c-bug:#ef4444;--warn:#f59e0b}
html[data-theme=dark]{--accent:#0a84ff;--tx1:#f5f5f7;--tx2:#d1d1d6;--tx3:#98989d;--bg:#1c1c1e;--card:#232325;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.07);
  --m-bar:rgba(40,40,42,.86);--m-ctl:#3a3a3c;--m-ctl-h:#444446;--m-ctl-a:#505052;--m-bd:rgba(255,255,255,.1);--m-sh:0 .5px 1px rgba(0,0,0,.4);--m-seg:rgba(255,255,255,.08);--m-hd:#2a2a2c;--m-sel:rgba(10,132,255,.28);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--tx1);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--m-bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header h1{font-size:14px;font-weight:600;white-space:nowrap}
.sp{flex:1}
.btn,header a.btn{background:var(--m-ctl);color:var(--tx1);border:.5px solid var(--m-bd);box-shadow:var(--m-sh);border-radius:7px;height:28px;padding:0 12px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--m-ctl-h)}.btn:active{background:var(--m-ctl-a)}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.sm{height:24px;padding:0 8px;font-size:11px}
.seg{display:inline-flex;background:var(--m-seg);border-radius:8px;padding:2px;gap:0}
.seg button{background:transparent;border:0;height:24px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--tx2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--m-ctl);color:var(--tx1);box-shadow:0 1px 2px rgba(0,0,0,.18)}
#projName{height:28px;width:200px;border-radius:7px;border:1px solid transparent;background:var(--m-seg);padding:0 10px}
#projName:focus{outline:none;border-color:var(--accent);background:var(--card)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.bar input[type=search],.bar select{height:28px;border-radius:7px;border:.5px solid var(--m-bd);background:var(--m-ctl);padding:0 8px}
#ms{font-size:12px;color:var(--tx2);padding:4px 10px;border-radius:7px;background:var(--m-seg);max-width:100%;min-width:0;overflow-wrap:anywhere}
#ms b{color:var(--tx1)}#ms.late b{color:var(--c-bug)}
main{padding:12px;overflow:auto;height:calc(100% - 48px - 45px)}
.view{display:none}.view.on{display:block}
/* backlog */
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.sech{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--m-hd);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.sech h3{font-size:13px;font-weight:600}
.sech .meta{color:var(--tx3);font-size:12px}
.sech .cap{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--m-seg)}
.sech .cap.over{background:rgba(239,68,68,.15);color:var(--c-bug)}
.list{min-height:36px}
.list.dragover{background:var(--m-sel)}
.row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line2);cursor:pointer;background:var(--card)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--m-hd)}
.row .key{color:var(--tx3);font-size:11px;min-width:58px}
.row .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .tt{text-decoration:line-through;color:var(--tx3)}
.ty{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.ty.epic{background:var(--c-epic)}.ty.story{background:var(--c-story)}.ty.task{background:var(--c-task)}.ty.bug{background:var(--c-bug)}
.pill{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--m-seg);color:var(--tx2);white-space:nowrap}
.pill.ep{background:rgba(139,92,246,.15);color:var(--c-epic)}
.pts{min-width:22px;text-align:center;font-size:11px;font-weight:600;border-radius:9px;background:var(--m-seg);padding:1px 6px}
.pr{font-size:11px;width:14px;text-align:center;color:var(--tx3);font-weight:700}
.st{font-size:11px;padding:1px 7px;border-radius:9px;white-space:nowrap}
.st.todo{background:var(--m-seg)}.st.doing{background:rgba(59,130,246,.15);color:var(--c-task)}.st.review{background:rgba(245,158,11,.18);color:#b45309}.st.done{background:rgba(34,197,94,.15);color:#15803d}
.empty{padding:12px;color:var(--tx3);font-size:12px;text-align:center}
/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--m-hd);border-radius:10px;padding:8px;min-height:300px;display:flex;flex-direction:column}
.col h4{font-size:12px;font-weight:600;color:var(--tx2);padding:2px 4px 8px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.03em}
.col h4 .wip.over{color:var(--c-bug)}
.col.over{box-shadow:inset 0 0 0 2px var(--c-bug)}
.col .cards{flex:1;display:flex;flex-direction:column;gap:6px;min-height:40px;border-radius:8px}
.col .cards.dragover{background:var(--m-sel)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:grab;box-shadow:var(--m-sh)}
.card .tt{margin-bottom:6px;line-height:1.35}
.card .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .who{margin-left:auto;font-size:11px;color:var(--tx3)}
.card.dragging,.row.dragging{opacity:.4}
.mv{margin-left:4px;display:inline-flex;gap:2px;flex:none}
.mv button{width:20px;height:20px;border-radius:5px;border:.5px solid var(--m-bd);background:var(--m-ctl);color:var(--tx2);cursor:pointer;font-size:13px;line-height:1;padding:0}
.mv button:disabled{opacity:.3;cursor:default}
/* reports & epics */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.panel h3{font-size:13px;margin-bottom:8px}
.panel svg{width:100%;height:auto;display:block}
.kpi{display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.kpi div{font-size:12px;color:var(--tx3)}.kpi b{display:block;font-size:18px;color:var(--tx1)}
table.ep{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.ep th,table.ep td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left;font-size:12px;vertical-align:middle}
table.ep th{background:var(--m-hd);font-weight:600;color:var(--tx2)}
.prog{height:6px;background:var(--m-seg);border-radius:3px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--c-story)}
table.ep a{color:var(--tx1);text-decoration:none}table.ep a:hover{color:var(--accent);text-decoration:underline}
table.ep select{max-width:240px;height:26px;border-radius:6px;border:.5px solid var(--m-bd);background:var(--m-ctl)}
.hint{font-size:12px;color:var(--tx3);margin:8px 2px}
/* dialog */
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:50}
.dlg.on{display:flex}
.dlg .box{background:var(--card);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:min(560px,94vw);max-height:90vh;overflow:auto;padding:16px 18px}
.dlg h2{font-size:15px;margin-bottom:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--tx2)}
.fg label.full{grid-column:1/-1}
.fg input,.fg select,.fg textarea{height:30px;border-radius:7px;border:.5px solid var(--m-bd);background:var(--m-ctl);padding:0 8px;color:var(--tx1)}
.fg textarea{height:80px;padding:6px 8px;resize:vertical}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.dlg .acts .del{margin-right:auto;color:var(--c-bug)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(29,29,31,.88);color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
.dd{position:relative;display:inline-flex}
.ddm{display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:200px;background:var(--card);border:.5px solid var(--m-bd);border-radius:10px;padding:5px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:40;flex-direction:column}
.dd.open .ddm{display:flex}
.ddm button{background:transparent;border:0;text-align:left;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.ddm button:hover{background:var(--accent);color:#fff}
/* 顶栏在 ≤1024px 也换行：900px 宽时顶栏内容约 934px，固定 48px 高会横向溢出整页（横向滚动条、右侧内容被切） */
@media (max-width:1024px){
  header{height:auto;min-height:52px;flex-wrap:wrap;padding:6px 8px}
  header h1{display:none}
  #projName{width:140px}
  main{height:auto}
}
@media (max-width:760px){
  header{height:auto;min-height:52px;flex-wrap:wrap;padding:6px 8px}
  header h1{display:none}
  #projName{width:140px}
  main{height:auto;padding:8px}
  .board{grid-template-columns:repeat(4,80vw);scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .grid2{grid-template-columns:1fr}
  .row .lb,.row .ep-pill{display:none}
  .fg{grid-template-columns:1fr}
  #langBtns button{padding:0 7px}
}
</style>
</head>
<body>
<header>
  <h1>ProjectPilot · Agile</h1>
  <input id="projName" autocomplete="off">
  <div class="seg" id="tabs">
    <button data-v="backlog" class="on" data-t="tBacklog">待办</button><button data-v="board" data-t="tBoard">看板</button><button data-v="reports" data-t="tReports">报表</button><button data-v="epics" data-t="tEpics">史诗</button>
  </div>
  <span class="sp"></span>
  <div class="dd" id="ddFile"><button class="btn" data-t="file">文件 ▾</button>
    <div class="ddm">
      <button data-a="expJson" data-t="expJson">导出 JSON</button>
      <button data-a="impJson" data-t="impJson">导入 JSON</button>
      <button data-a="expCsv" data-t="expCsv">导出 Jira CSV</button>
      <button data-a="impCsv" data-t="impCsv">导入 Jira CSV</button>
      <button data-a="demo" data-t="demo">载入示例</button>
      <button data-a="clear" data-t="clear">清空</button>
    </div>
  </div>
  <a class="btn" href="../" id="lnkMain">ProjectPilot ↗</a>
  <div class="seg" id="themeBtns"><button data-th="light">☀</button><button data-th="dark">🌙</button><button data-th="system">🖥</button></div>
  <div class="seg" id="langBtns"><button data-lang="zh">中文</button><button data-lang="en">EN</button><button data-lang="de">DE</button></div>
</header>
<div class="bar">
  <button class="btn pri" id="btnNew" data-t="newItem">＋ 新建</button>
  <input type="search" id="q" data-tp="search" placeholder="搜索">
  <select id="fType"><option value="" data-t="allTypes">全部类型</option><option value="story" data-t="story">故事</option><option value="task" data-t="task">任务</option><option value="bug" data-t="bug">缺陷</option></select>
  <select id="fWho"></select>
  <select id="fSprint"></select>
  <span class="sp"></span>
  <span id="ms"></span>
</div>
<main>
  <section class="view on" id="v-backlog"></section>
  <section class="view" id="v-board"></section>
  <section class="view" id="v-reports"></section>
  <section class="view" id="v-epics"></section>
</main>

<div class="dlg" id="dlgItem"><div class="box">
  <h2 id="diTitle"></h2>
  <div class="fg">
    <label class="full"><span data-t="fTitle">标题</span><input id="iTitle"></label>
    <label><span data-t="fType">类型</span><select id="iType"><option value="story" data-t="story">故事</option><option value="task" data-t="task">任务</option><option value="bug" data-t="bug">缺陷</option><option value="epic" data-t="epic">史诗</option></select></label>
    <label><span data-t="fStatus">状态</span><select id="iStatus"></select></label>
    <label><span data-t="fPts">故事点</span><select id="iPts"></select></label>
    <label><span data-t="fPrio">优先级</span><select id="iPrio"></select></label>
    <label><span data-t="fWho">负责人</span><input id="iWho" list="whoList"></label>
    <label><span data-t="fSprint">冲刺</span><select id="iSprint"></select></label>
    <label><span data-t="fEpic">所属史诗</span><select id="iEpic"></select></label>
    <label><span data-t="fLabels">标签（逗号分隔）</span><input id="iLabels"></label>
    <label class="full"><span data-t="fDesc">描述</span><textarea id="iDesc"></textarea></label>
  </div>
  <datalist id="whoList"></datalist>
  <div class="acts"><button class="btn del" id="iDel" data-t="del">删除</button><button class="btn" data-close data-t="cancel">取消</button><button class="btn pri" id="iSave" data-t="save">保存</button></div>
</div></div>

<div class="dlg" id="dlgSprint"><div class="box">
  <h2 id="dsTitle"></h2>
  <div class="fg">
    <label class="full"><span data-t="sName">名称</span><input id="sName"></label>
    <label><span data-t="sStart">开始</span><input type="date" id="sStart"></label>
    <label><span data-t="sLen">长度（工作日）</span><input type="number" id="sLen" min="1" max="60"></label>
    <label><span data-t="sEnd">结束</span><input type="date" id="sEnd"></label>
    <label><span data-t="sCap">容量（点）</span><input type="number" id="sCap" min="0"></label>
    <label class="full"><span data-t="sGoal">冲刺目标</span><input id="sGoal"></label>
  </div>
  <div class="acts"><button class="btn del" id="sDel" data-t="del">删除</button><button class="btn" data-close data-t="cancel">取消</button><button class="btn pri" id="sSave" data-t="save">保存</button></div>
</div></div>

<div class="dlg" id="dlgCarry"><div class="box">
  <h2 id="dcTitle"></h2>
  <p id="dcText" style="font-size:13px;color:var(--tx2);line-height:1.5"></p>
  <div class="acts" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn pri" id="dcBacklog"></button><button class="btn pri" id="dcNext"></button><button class="btn" data-close data-t="cancel">取消</button></div>
</div></div>

<input type="file" id="fileIn" accept=".json,.csv" hidden>
<div id="toast"></div>

<script src="../workcal.js"></script>

    else { try{ var d = JSON.parse(r.result); if(d && Array.isArray(d.items)){ S = Object.assign(blank(), d); save(); $("#projName").value = S.name || ""; render(); toast(tr("imported", { n:S.items.length })); } }catch(x){ toast("JSON ✗"); } }
  }; r.readAsText(f, "utf-8");
});
window.addEventListener("storage", function(e){
  if(e.key === KEY){ load(); render(); }
  else if(e.key === MAIN){ renderMs(); if(view === "epics") renderEpics(); }
  else if(e.key === "gantt-workcal-v4" && W){ cal = W.load(); render(); }
  else if(e.key === "gantt-theme-v4") applyTheme();
});

load(); $("#projName").value = S.name || ""; applyTheme(); applyLang();
})();
</script>
